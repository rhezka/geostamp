name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - "leaflet/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Siapkan aset web di dalam app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.json sw.js exifr.min.js heic2any.min.js android/app/src/main/assets/www/
          cp icon-*.png android/app/src/main/assets/www/
          cp -R leaflet android/app/src/main/assets/www/leaflet

      - name: Build APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Tanda tangani APK
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          keytool -genkeypair -v -keystore release.jks -alias geostamp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass geostamp -keypass geostamp \
            -dname "CN=GeoStamp, OU=Personal, O=GeoStamp, L=Pontianak, C=ID"
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass pass:geostamp --key-pass pass:geostamp \
            --out GeoStamp.apk aligned.apk
          ls -la GeoStamp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoStamp-apk
          path: GeoStamp.apk
          if-no-files-found: error
