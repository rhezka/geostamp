name: GeoStamp
options:
  bundleIdPrefix: id.rhezka
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  GeoStamp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
      - path: Web
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: id.rhezka.geostamp
        PRODUCT_NAME: GeoStamp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
